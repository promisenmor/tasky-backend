services:
  web:
    build: .
    #reinstate later for my simple project: went back to using one single web container for simplicity.
    container_name: tasky-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web


  celery-worker:
    build: .
    container_name: tasky_celery_worker
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    container_name: tasky_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7

    container_name: tasky_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
